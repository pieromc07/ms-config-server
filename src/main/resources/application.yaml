server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: ms-config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:${CONFIG_REPO_PATH:./config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
